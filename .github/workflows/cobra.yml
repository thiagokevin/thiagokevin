name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: thiagokevin
          outputs: |
            github-contribution-grid-snake.svg?color_snake=4a4a4a&color_dots=1a1a1a,2a2a2a,3a3a3a,4a4a4a,5a5a5a

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

                
